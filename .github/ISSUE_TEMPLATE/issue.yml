name: Issue
description: Report a bug or request a small improvement
title: "[Issue]: "
labels: ["needs-triage"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Bug
        - Feature request
        - Documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, or what would you like to change?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Add commands, logs, OS, version, or screenshots if relevant.
    validations:
      required: false
